
services:
  bd_cliente_unico:
    image: postgres:16
    container_name: bd_cliente_unico
    environment:
      POSTGRES_USER: acity
      POSTGRES_PASSWORD: acity
      POSTGRES_DB: bd_cliente_unico
    ports:
      - "5432:5432"
    volumes:
      - /docker-entrypoint-initdb.d
    restart: always
